<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt App</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            font-size: 14px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #eef2f5;
            border-left: 5px solid #007bff;
            border-radius: 4px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Groq AI Assistant</h2>
        <form action="/ai" method="POST">
            <textarea name="prompt" placeholder="Write your prompt here..." required></textarea>
            <button type="submit">Send Prompt</button>
        </form>

        <div class="result-box">
            <strong>Response:</strong>
            <p>__RESULT__</p>
        </div>
    </div>

</body>

</html>
